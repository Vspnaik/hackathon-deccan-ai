version: '3.8'

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: talent_scout_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: talent_scout
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
